name: Build unsigned MSI

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: File/release label, for example 2.0.8-beta
        required: true
        default: 2.0.8-beta
      product_version:
        description: Numeric MSI ProductVersion
        required: true
        default: 2.0.8.0
      publish_release:
        description: Attach artifacts to a GitHub prerelease with tag v<release_label>
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@77a1d3d18379c7cb0a7e3b9fcaaa4d94f1029763 # 0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build, test and validate unsigned MSI
        shell: pwsh
        run: ./scripts/build-release.ps1 -ReleaseLabel '${{ inputs.release_label }}' -ProductVersion '${{ inputs.product_version }}'
      - name: Upload unsigned release artifact
        id: unsigned-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yamatana-ai-ime-${{ inputs.release_label }}-unsigned
          path: |
            release/Yamatana-AI-IME-MOZC-Ver-${{ inputs.release_label }}-x64.msi
            release/SHA256SUMS.txt
            release/install-msi.ps1
            release/Install-Yamatana-AI-IME.cmd
          if-no-files-found: error
          retention-days: 30
      - name: Publish unsigned prerelease
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.release_label }}
          prerelease: true
          generate_release_notes: true
          body: |
            **Unsigned Beta:** This release is not code-signed yet.
            Verify the MSI with the attached SHA256SUMS.txt before installation.
          files: |
            release/Yamatana-AI-IME-MOZC-Ver-${{ inputs.release_label }}-x64.msi
            release/SHA256SUMS.txt
            release/install-msi.ps1
            release/Install-Yamatana-AI-IME.cmd
