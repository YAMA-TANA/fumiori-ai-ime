name: Repair renamed Pages links

on:
  push:
    branches:
      - fix/pages-rename-links-20260920
    paths:
      - 'scripts/fix_pages_links.py'
      - '.github/workflows/repair-renamed-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Repair all tracked URL references and validate site assets
        run: python3 scripts/fix_pages_links.py
      - name: Commit the repaired files to the repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo 'All links are already correct.'
          else
            git commit -m "fix(pages): migrate all old project URLs to fumiori-ai-ime"
            git push origin HEAD:fix/pages-rename-links-20260920
          fi
