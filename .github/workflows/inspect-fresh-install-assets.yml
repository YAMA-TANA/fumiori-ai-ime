name: Inspect clean-install release assets
on:
  push:
    branches: [fix/fresh-pc-installer-20260920]
    paths: ['.github/workflows/inspect-fresh-install-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect actual published hotfix archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, urllib.request, zipfile
          url = 'https://github.com/YAMA-TANA/fumiori-ai-ime/releases/download/v2.1.1-beta/Yamatana-AI-IME-v2.1.1-beta-candidate10.zip'
          data=urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Fumiori-install-check'}),timeout=120).read()
          print('Archive bytes:',len(data),'SHA256:',hashlib.sha256(data).hexdigest(),flush=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            print('ZIP entries:', len(z.infolist()), flush=True)
            for f in z.infolist():
              print(f.filename, f.file_size, flush=True)
            print('Install script:', z.read('scripts/apply_hotfix.ps1').decode('utf-8-sig')[:1000] if 'scripts/apply_hotfix.ps1' in z.namelist() else 'NOT FOUND',flush=True)
          PY